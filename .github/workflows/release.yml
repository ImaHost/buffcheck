name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Tesseract
        run: choco install tesseract --yes --no-progress

      - name: Stage Tesseract binaries
        run: python scripts/stage_tesseract.py

      - name: Ensure icons DB
        run: python backend/build_icon_db.py

      - name: Build frontend + backend + installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          python scripts/build_backend.py
          npx electron-builder --win nsis --publish always

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: BuffCheck-Windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: warn
